[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HDM"
version = "0.0.1"
authors = [
  { name="Felix Granum", email="felix+hdmaps@hjerrild.org" },
  { name="Sofus Hesseldahl Laubel", email="sofus@laubel.net"}
]
description = "HDM description"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
dependencies = [
    "numpy>=2.0,<3.0",
    "scipy>=1.15,<2.0",
    "torch>=2.0",
]


[project.urls]
Homepage = "https://github.com/frisbro303/HDM_Python"

[tool.setuptools.packages.find]
include = ["hdmaps*"]


[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pyright>=1.1,<2.0",
]
gpu = [                                                                                                                                                                             
    "cupy-cuda13x>=13.0",                                                                                                                                                    
]   
docs = [
    "myst-nb>=1.4.0",
    "sphinx>=9.1.0",
    "sphinx-book-theme>=1.4.0",
]
visual = [
    "matplotlib>=3,<4.0",
    "pyvista>=0.49.0",
]

[tool.pytest.ini_options]
testpaths = ["hdmaps/tests"]
filterwarnings = ["ignore:Sparse (invariant checks are implicitly disabled|CSR tensor support is in beta)"]
markers = [
    "gpu: end-to-end tests requiring a CUDA GPU with cupy (run with -m gpu; skipped otherwise)",
]
